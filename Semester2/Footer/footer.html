<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Footer</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css"
      integrity="sha512-9xKTRVabjVeZmc+GUW8GgSmcREDunMM+Dt/GrzchfN8tkwHizc5RP4Ok/MXFFy5rIjJjzhndFScTceq5e6GvVQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <style>
      /* Mobile first Design */
      body {
        background-color: #cff1d4;
        color: rgb(15, 0, 148);
        line-height: 1.7;
        margin: 0;
      }
      h1 {
        padding: 1rem;
        text-align: center;
        color: rgb(5, 94, 58);
      }
      #pagefooter {
        border-top: 1px solid silver;
        background-color: #daf4de;
        padding: 1rem;
        text-align: center;
        display: flex;
        flex-direction: column;
      }
      #pagefooter > p {
        /* border: 1px solid silver; */
        padding: 1rem;
      }
      #pagefooter > article {
        /* border: 1px solid silver; */
        padding: 1rem;
      }

      /* Font Awesome styles */

      i {
        color: rgb(5, 94, 58);
        font-size: 1.2rem;
        margin-left: 0.3rem;
        margin-right: 0.3rem;
      }
      i.fa-paw {
        transform: rotate(45deg);
      }

      @media screen and (min-width: 700px) {
        body {
          background-color: #bde9ee;
        }
        #pagefooter {
          flex-direction: row;
          text-align: left;
          justify-content: space-between;
        }
      }
    </style>
  </head>
  <body>
    <h1>Footer</h1>
    <footer id="pagefooter">
      <p>
        <i class="fa-solid fa-paw"></i> Paws and Whiskers <br />
        Made with <i class="fa-solid fa-heart"></i> for fury friends
      </p>
      <article>
        <i class="fa-solid fa-phone"></i> 559-935-7520 <br />
        <i class="fa-solid fa-envelope"></i> info@pawsandwhiskers.com <br />
        <i class="fa-solid fa-location-dot"></i> 750 van ness St, Coalinga, Ca
        93210
      </article>
    </footer>
  </body>
</html>
