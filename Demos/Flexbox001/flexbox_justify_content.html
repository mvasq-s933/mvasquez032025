<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Justify Content</title>
    <style>
        h1,
        h2{
            text-align: center;
        }

        #container001 {
            border: 5px solid black;
            background-color: rgb(255, 203, 203);
            margin: 1rem;
            display: flex;
            justify-content: flex-end;
            justify-content: center;
            justify-content: flex-start;
            justify-content: space-between;
            justify-content: space-around;
            justify-content: space-evenly;
        }
        #container002 {
            border: 5px solid black;
            background-color: rgb(170, 196, 239);
            margin: 1rem;
            display: flex;
            flex-direction: row-reverse;
            justify-content: space-evenly;
        }
        #container003 {
            border: 5px solid black;
            background-color: rgb(123, 63, 63);
            margin: 1rem;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 700px;
        }
        


        .box {
            border: 1px solid black;
            background-color: lightblue;
            width: 100px;
            height: 100px;
            padding: .5rem;
        }

        @media screen and (min-width:800px) 
            body {background-color: lightslategray;
        }
    </style>
</head>
<body>
    <h1>Flexbox</h1>
    <h2>Justify Content</h2>
    <ul>
        <li>flex-end</li>
        <li>center</li>
        <li>flex-start</li>
        <li>space-between</li>
        <li>space-around</li>
        <li>space-evenly</li>
    </ul>

    <h1>Container001</h1>
    <div id="container001">
        <div class="box">Items 1</div>
        <div class="box">Items 2</div>
        <div class="box">Items 3</div>
        <div class="box">Items 4</div>
        <div class="box">Items 5</div>
    </div>
    <h2>Container002</h2>
    <div id="container002">
        <div class="box">Items 1</div>
        <div class="box">Items 2</div>
        <div class="box">Items 3</div>
        <div class="box">Items 4</div>
        <div class="box">Items 5</div>
    </div>
    <h3>container003</h3>
    <div id="container003">
        <div class="box">Items 1</div>
        <div class="box">Items 2</div>
        <div class="box">Items 3</div>
        <div class="box">Items 4</div>
        <div class="box">Items 5</div>
    </div>
</body>
</html>
