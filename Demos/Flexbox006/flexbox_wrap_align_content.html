<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Wrap and Align Content</title>
    <style>
      h1,
      h2 {
        text-align: center;
      }

      #container001 {
        border: 5px solid black;
        background-color: #19b4e7;
        margin: 1rem;
        display: flex;
        align-items: flex-start;
        flex-wrap: wrap;
        align-content: space-between;
        height: 700px;
      }

      .box {
        border: 1px solid black;
        background-color: lightcoral;
        flex-basis: 100px;
        height: 100px;
        padding: 0.5rem;
      }
      @media screen {
        body {
          background-color: rgb(255, 191, 191);
        }
      }

      #container002 {
        border: 5px solid black;
        background-color: coral;
        margin: 1rem;
        display: flex;
        flex-direction: row-reverse;
        justify-content: space-evenly;
      }

      #container003 {
        border: 5px solid black;
        background-color: crimson;
        margin: 1rem;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        height: 700px;
      }

      .box {
        border: 1px solid black;
        background-color: rgb(195, 255, 195);
        width: 100px;
        height: 100px;
        padding: 0.5rem;
      }

      @media screen and (min-width: 800px) {
        body {
          background-color: lightslategrey;
        }
      }

      @media screen and (min-width: 1000px) {
        body {
          background-color: brown;
        }
      }
    </style>
  </head>

  <body>
    <h1>Flexbox</h1>
    <h2>Flex-Wrap - Align-content</h2>

    <h2>Container001</h2>
    <div id="container001">
      <div class="box">Item001</div>
      <div class="box">Item002</div>
      <div class="box">Item003</div>
      <div class="box">Item004</div>
      <div class="box">Item005</div>
    </div>
    <h2>Container002</h2>
    <div id="container002">
      <div class="box">Item001</div>
      <div class="box">Item002</div>
      <div class="box">Item003</div>
      <div class="box">Item004</div>
      <div class="box">Item005</div>
    </div>
    <h2>Container003</h2>
    <div id="container003">
      <div class="box">Item001</div>
      <div class="box">Item002</div>
      <div class="box">Item003</div>
      <div class="box">Item004</div>
      <div class="box">Item005</div>
    </div>
  </body>
</html>
