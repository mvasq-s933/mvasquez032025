<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Queries</title>
    <style>
      /* Mobile first Design */
      body {
        background-color: lightblue;
      }
      h1,
      h2 {
        color: white;
        text-align: center;
      }

      /* Tablets and Desktop Design*/
      @media screen and(min-width: 700px) {
        body {
          background-color: rgb(181, 248, 181);
        }
        h1,
        h2 {
          color: rgb(0, 0, 0);
        }
      }

      @media screen and (min-width: 960px) {
        body {
          background-color: rgb(248, 181, 181);
          h1,
          h2 {
            color: rgb(255, 255, 255);
          }
        }
      }

      @media screen and (min-width: 1280px) {
        body {
          background-color: rgb(248, 248, 181);
          h1,
          h2 {
            color: rgb(255, 255, 255);
          }
        }
      }
    </style>
  </head>
  <body>
    <h1>Media Queries</h1>
    <h2>Marbely Vasquez</h2>
  </body>
</html>
